name: ARM64 Android emulator smoke test

on:
  workflow_dispatch:
    inputs:
      api_level:
        description: Android API level with a published ARM64 Google APIs image
        required: true
        default: "36"
      boot_timeout:
        description: Emulator boot timeout in seconds
        required: true
        default: "900"
  workflow_call:

permissions:
  contents: read

jobs:
  arm64-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      API_LEVEL: ${{ inputs.api_level || '36' }}
      BOOT_TIMEOUT: ${{ inputs.boot_timeout || '900' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install SDK and ARM64 image
        run: |
          sdkmanager --install "platform-tools" "platforms;android-$API_LEVEL" "build-tools;36.0.0" "emulator" "system-images;android-$API_LEVEL;google_apis;arm64-v8a"
          yes | sdkmanager --licenses >/dev/null
      - name: Create and boot ARM64 emulator
        run: |
          echo "no" | avdmanager create avd --force --name ci_arm64 --package "system-images;android-$API_LEVEL;google_apis;arm64-v8a" --device pixel_2
          emulator -version
          (emulator -avd ci_arm64 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -accel off > emulator.log 2>&1 &)
          adb start-server
          deadline=$((SECONDS + BOOT_TIMEOUT))
          booted=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            if adb shell getprop sys.boot_completed 2>/dev/null | grep -q '^1$'; then booted=1; break; fi
            sleep 5
          done
          if [ "$booted" -ne 1 ]; then
            cat emulator.log
            echo "ARM64 emulator failed to boot on this runner." >&2
            exit 1
          fi
          adb shell getprop ro.product.cpu.abi | tee emulator-abi.txt
          grep -q 'arm64-v8a' emulator-abi.txt
          adb shell getprop ro.build.version.sdk
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-emulator-diagnostics
          path: |
            emulator.log
            emulator-abi.txt
          if-no-files-found: ignore
