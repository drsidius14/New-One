name: x86_64 Android emulator smoke test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-arm64-emulator.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - 'test-assets/originals/**'
  workflow_dispatch:
    inputs:
      api_level:
        description: Android API level with a published x86_64 Google APIs image
        required: true
        default: "36"
      boot_timeout:
        description: Emulator boot timeout in seconds
        required: true
        default: "900"
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  x86_64-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      API_LEVEL: ${{ inputs.api_level || '36' }}
      BOOT_TIMEOUT: ${{ inputs.boot_timeout || '900' }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare diagnostic files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          for f in emulator.log emulator-abi.txt emulator-properties.txt host-dependencies.txt kvm-status.txt; do : > "diagnostics/$f"; done
          {
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "api_level=$API_LEVEL"
            echo "boot_timeout=$BOOT_TIMEOUT"
            date -u '+started_utc=%Y-%m-%dT%H:%M:%SZ'
          } > diagnostics/run-info.txt

      - name: Install PulseAudio runtime library
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          if apt-cache show libpulse0t64 >/dev/null 2>&1; then
            PULSE_PACKAGE=libpulse0t64
          elif apt-cache show libpulse0 >/dev/null 2>&1; then
            PULSE_PACKAGE=libpulse0
          else
            echo 'No PulseAudio runtime package found in configured apt repositories.' >&2
            apt-cache search '^libpulse0' | tee diagnostics/pulse-package-search.txt >&2 || true
            exit 1
          fi
          echo "pulse_package=$PULSE_PACKAGE" | tee diagnostics/pulse-package.txt
          sudo apt-get install -y "$PULSE_PACKAGE"
          ldconfig -p | grep 'libpulse.so.0' | tee diagnostics/pulse-library.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: python3 scripts/accept_android_licenses.py

      - name: Install SDK and x86_64 image
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-$API_LEVEL" \
            "build-tools;36.0.0" \
            "emulator" \
            "system-images;android-$API_LEVEL;google_apis;x86_64"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/emulator/emulator"
          test -d "$ANDROID_HOME/system-images/android-$API_LEVEL/google_apis/x86_64"
          # QEMU ships with private Android Emulator libraries. Set the SDK's
          # runtime search paths before using ldd; a bare ldd reports false
          # "not found" errors for these SDK-bundled libraries.
          export LD_LIBRARY_PATH="$ANDROID_HOME/emulator/lib64:$ANDROID_HOME/emulator/lib64/qt/lib:$ANDROID_HOME/emulator/lib64/qt/plugins${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          QEMU="$ANDROID_HOME/emulator/qemu/linux-x86_64/qemu-system-x86_64"
          if [ -x "$QEMU" ]; then
            ldd "$QEMU" | tee diagnostics/host-dependencies.txt
            if grep -q 'not found' diagnostics/host-dependencies.txt; then
              echo 'QEMU has unresolved shared-library dependencies even with Android SDK library paths.' >&2
              exit 1
            fi
          else
            echo "QEMU binary not found at expected path: $QEMU" | tee diagnostics/host-dependencies.txt
            exit 1
          fi
          "$ANDROID_HOME/emulator/emulator" -version 2>&1 | tee diagnostics/emulator-version.txt
          "$ANDROID_HOME/platform-tools/adb" version 2>&1 | tee diagnostics/adb-version.txt

      - name: Create and boot x86_64 emulator
        shell: bash
        run: |
          set -uo pipefail
          AVDMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name avdmanager -type f | sort | tail -n 1)"
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          ADB="$ANDROID_HOME/platform-tools/adb"
          # Use the same explicit AVD directory for creation and launch.
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          if ! printf 'no\n' | "$AVDMANAGER" create avd --force --name ci_x86_64 --package "system-images;android-$API_LEVEL;google_apis;x86_64" --device pixel_2 2>&1 | tee diagnostics/avd-create.log; then
            echo 'AVD creation command failed.' >&2
            exit 1
          fi
          if [ ! -s "$ANDROID_AVD_HOME/ci_x86_64.ini" ] || [ ! -d "$ANDROID_AVD_HOME/ci_x86_64.avd" ]; then
            echo "AVD creation did not produce expected files under $ANDROID_AVD_HOME." | tee diagnostics/avd-create-result.txt >&2
            find "$HOME/.android" -maxdepth 4 \( -type f -name 'ci_x86_64.ini' -o -type d -name 'ci_x86_64.avd' \) -print 2>&1 | tee diagnostics/avd-locations.txt >&2 || true
            cat diagnostics/avd-create.log >&2 || true
            exit 1
          fi
          # Diagnose KVM before launching: software-only x86_64 emulation on a
          # hosted runner can take many minutes and may never finish booting.
          {
            echo "user=$(id -un)"
            echo "groups=$(id -Gn)"
            if [ -e /dev/kvm ]; then
              ls -l /dev/kvm
              stat /dev/kvm || true
              getent group kvm || true
            else
              echo "/dev/kvm is absent"
            fi
          } > diagnostics/kvm-status.txt 2>&1
          if [ ! -e /dev/kvm ]; then
            echo "KVM device /dev/kvm is unavailable; refusing a slow software-only boot." | tee -a diagnostics/kvm-status.txt >&2
            exit 1
          fi
          # GitHub-hosted Ubuntu runners may expose /dev/kvm without granting
          # the runner user access. Change only the device permissions for this
          # ephemeral job; do not modify the repository or host configuration.
          sudo chmod 666 /dev/kvm 2>> diagnostics/kvm-status.txt || true
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "KVM exists but remains inaccessible after the permission adjustment." | tee -a diagnostics/kvm-status.txt >&2
            ls -l /dev/kvm >> diagnostics/kvm-status.txt 2>&1 || true
            exit 1
          fi
          echo "kvm_access=read-write" | tee -a diagnostics/kvm-status.txt
          "$EMULATOR" -avd ci_x86_64 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on > diagnostics/emulator.log 2>&1 &
          EMULATOR_PID=$!
          echo "$EMULATOR_PID" > diagnostics/emulator.pid
          "$ADB" start-server 2>&1 | tee diagnostics/adb-start.log
          deadline=$((SECONDS + BOOT_TIMEOUT))
          booted=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo 'Emulator process exited before boot completed.' | tee diagnostics/boot-result.txt >&2
              break
            fi
            if "$ADB" shell getprop sys.boot_completed 2>/dev/null | grep -q '^1$'; then booted=1; break; fi
            sleep 5
          done
          if [ "$booted" -ne 1 ]; then
            echo 'x86_64 emulator failed to boot on this runner.' | tee diagnostics/boot-result.txt >&2
            "$ADB" devices -l > diagnostics/adb-devices.txt 2>&1 || true
            cat diagnostics/emulator.log || true
            exit 1
          fi
          echo 'boot_completed=1' | tee diagnostics/boot-result.txt
          "$ADB" shell getprop ro.product.cpu.abi | tee diagnostics/emulator-abi.txt
          grep -q 'x86_64' diagnostics/emulator-abi.txt
          "$ADB" shell getprop ro.build.version.sdk | tee diagnostics/emulator-sdk.txt
          "$ADB" shell getprop > diagnostics/emulator-properties.txt
          "$ADB" devices -l > diagnostics/adb-devices.txt

      - name: Install original Mi Fitness and compare Research variants
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ADB="$ANDROID_HOME/platform-tools/adb"
          mkdir -p test-apk diagnostics/runtime/baseline-original diagnostics/runtime/candidate-russian
          gh release download runtime-test-assets-v1 --repo "$GITHUB_REPOSITORY" \
            --pattern '*.apk' --dir test-apk
          FITNESS_APK="test-apk/mi-fitness-3.59.1.apk"
          ORIGINAL_RESEARCH="test-apk/mi-health-research-1.4.6-original.apk"
          test -s "$FITNESS_APK" || { echo 'Mi Fitness release asset missing' >&2; exit 1; }
          test -s "$ORIGINAL_RESEARCH" || { echo 'Original Research release asset missing' >&2; exit 1; }
          FITNESS_SHA="$(sha256sum "$FITNESS_APK" | awk '{print $1}')"
          echo "$FITNESS_SHA  test-apk/mi-fitness-3.59.1.apk" | tee diagnostics/runtime/mi-fitness-sha256.txt
          test "$FITNESS_SHA" = "46100649d47000e8886d94cfbb34c18706e492a5d3aaa7f34cd4785841ffc254" || { echo 'Mi Fitness SHA-256 mismatch' >&2; exit 1; }
          ORIG_SHA="$(sha256sum "$ORIGINAL_RESEARCH" | awk '{print $1}')"
          echo "$ORIG_SHA  $ORIGINAL_RESEARCH" | tee diagnostics/runtime/original-research-sha256.txt
          test "$ORIG_SHA" = "9e872f2d75e4ec1d509216d8caa998c2957d797c57b8ecc1ed8c92054f53c4bc" || { echo 'Original Research SHA-256 mismatch' >&2; exit 1; }
          "$ADB" install -r "$FITNESS_APK" 2>&1 | tee diagnostics/runtime/mi-fitness-install.txt
          "$ADB" shell pm path com.mi.health | tee diagnostics/runtime/mi-fitness-package-path.txt
          "$ADB" shell dumpsys package com.mi.health > diagnostics/runtime/mi-fitness-package.txt
          "$ADB" shell pm clear com.mi.health >/dev/null 2>&1 || true
          "$ADB" install -r "$ORIGINAL_RESEARCH" 2>&1 | tee diagnostics/runtime/baseline-original/install.txt
          "$ADB" logcat -c
          set +e
          "$ADB" shell monkey -p com.mi.healthresearch 1 > diagnostics/runtime/baseline-original/launch.txt 2>&1
          BASELINE_STATUS=$?
          set -e
          echo "monkey_exit=$BASELINE_STATUS" >> diagnostics/runtime/baseline-original/launch.txt
          sleep 25
          "$ADB" shell dumpsys activity activities > diagnostics/runtime/baseline-original/activities.txt 2>&1 || true
          "$ADB" logcat -d -v threadtime > diagnostics/runtime/baseline-original/logcat-full.txt
          grep -Ei 'mi\.healthresearch|AndroidRuntime|FATAL EXCEPTION|SecurityException|Permission Denial|DefaultRemoteService|ResearchData|mi\.intent\.action\.DEFAULT|com\.mi\.health' diagnostics/runtime/baseline-original/logcat-full.txt > diagnostics/runtime/baseline-original/logcat-relevant.txt || true
          "$ADB" shell screencap -p /sdcard/research-original.png
          "$ADB" pull /sdcard/research-original.png diagnostics/runtime/baseline-original/screenshot.png >/dev/null
          "$ADB" uninstall com.mi.healthresearch 2>&1 | tee diagnostics/runtime/candidate-russian/uninstall-original.txt
          gh run download 38162628347 --repo "$GITHUB_REPOSITORY" --name mi-health-research-1.4.6-ru-patched-apk --dir test-apk
          PATCHED_APK="$(find test-apk -type f -name '*.apk' ! -name 'mi-fitness-3.59.1.apk' ! -name 'mi-health-research-1.4.6-original.apk' -print -quit)"
          test -n "$PATCHED_APK" || { echo 'Russian Research APK missing from build artifact' >&2; exit 1; }
          PATCHED_SHA="$(sha256sum "$PATCHED_APK" | awk '{print $1}')"
          echo "$PATCHED_SHA  $PATCHED_APK" | tee diagnostics/runtime/candidate-russian/apk-sha256.txt
          test "$PATCHED_SHA" = "eb4fccd0058d6cab8508052b4666e6bfb8715d8b2f2adb67959c10eecae89bdb" || { echo 'Russian Research SHA-256 mismatch' >&2; exit 1; }
          "$ADB" shell pm clear com.mi.health >/dev/null 2>&1 || true
          "$ADB" install -r "$PATCHED_APK" 2>&1 | tee diagnostics/runtime/candidate-russian/install.txt
          "$ADB" logcat -c
          set +e
          "$ADB" shell monkey -p com.mi.healthresearch 1 > diagnostics/runtime/candidate-russian/launch.txt 2>&1
          CANDIDATE_STATUS=$?
          set -e
          echo "monkey_exit=$CANDIDATE_STATUS" >> diagnostics/runtime/candidate-russian/launch.txt
          sleep 25
          "$ADB" shell dumpsys activity activities > diagnostics/runtime/candidate-russian/activities.txt 2>&1 || true
          "$ADB" logcat -d -v threadtime > diagnostics/runtime/candidate-russian/logcat-full.txt
          grep -Ei 'mi\.healthresearch|AndroidRuntime|FATAL EXCEPTION|SecurityException|Permission Denial|DefaultRemoteService|ResearchData|mi\.intent\.action\.DEFAULT|com\.mi\.health' diagnostics/runtime/candidate-russian/logcat-full.txt > diagnostics/runtime/candidate-russian/logcat-relevant.txt || true
          "$ADB" shell screencap -p /sdcard/research-russian.png
          "$ADB" pull /sdcard/research-russian.png diagnostics/runtime/candidate-russian/screenshot.png >/dev/null
          { echo 'mi_fitness_installed=true'; echo "baseline_original_research_launch_exit=$BASELINE_STATUS"; echo "candidate_russian_research_launch_exit=$CANDIDATE_STATUS"; echo 'integration_status=SMOKE_TEST_ONLY'; echo 'note=Both Research variants launched with Mi Fitness installed; this does not prove every cross-app flow works.'; } | tee diagnostics/runtime/test-summary.txt
          if [ "$BASELINE_STATUS" -ne 0 ] || [ "$CANDIDATE_STATUS" -ne 0 ] || grep -Eq 'FATAL EXCEPTION|Process: com\.mi\.healthresearch' diagnostics/runtime/baseline-original/logcat-relevant.txt diagnostics/runtime/candidate-russian/logcat-relevant.txt; then echo 'runtime_status=FAIL' | tee -a diagnostics/runtime/test-summary.txt; exit 1; fi
          echo 'runtime_status=PASS' | tee -a diagnostics/runtime/test-summary.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x86_64-emulator-diagnostics
          path: diagnostics/
          if-no-files-found: error
          retention-days: 14
